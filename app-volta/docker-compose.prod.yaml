name: volta

services:
  postgres:
    image: postgres:15-alpine
    container_name: volta-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - volta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 600s
      timeout: 3s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - volta_internal
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  api:
    build: .
    container_name: volta-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./frontend/static:/app/frontend/static:ro
      - ./app_options/templates:/app/app_options/templates:ro
    command:
      - sh
      - -c
      - |
        alembic upgrade head
        uvicorn app_options.__main__:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    networks:
      - volta_internal
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: volta-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/static:/usr/share/nginx/static:ro
    depends_on:
      - api
    networks:
      - volta_internal
      - proxy_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  volta_pgdata:

networks:
  volta_internal:
    driver: bridge
  proxy_network:
    external: true
