<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart — Volta</title>
  <link rel="stylesheet" href="/static/css/panel.css">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <h1 class="brand brand-title">Volta</h1>
      <nav class="asset-tabs" id="asset-tabs">
        <button type="button" data-base="BTC" class="active">BTC</button>
        <button type="button" data-base="ETH">ETH</button>
        <button type="button" data-base="SOL">SOL</button>
      </nav>
    </div>
    <div class="toolbar-center">
      <nav class="tf-tabs" id="tf-tabs">
        <button type="button" data-interval="1m">1m</button>
        <button type="button" data-interval="5m" class="active">5m</button>
        <button type="button" data-interval="15m">15m</button>
        <button type="button" data-interval="1h">1h</button>
        <button type="button" data-interval="4h">4h</button>
        <button type="button" data-interval="1d">1d</button>
      </nav>
    </div>
    <div class="toolbar-right">
      <label class="toggle"><input type="checkbox" id="toggle-futures" checked> Futures</label>
      <label class="toggle"><input type="checkbox" id="toggle-call" checked> Call</label>
      <label class="toggle"><input type="checkbox" id="toggle-put" checked> Put</label>
      <label class="toggle"><input type="checkbox" id="toggle-pm" checked> Polymarket</label>
      <form method="post" action="/logout" class="logout-form">
        <button type="submit">Logout</button>
      </form>
    </div>
  </header>

  <div class="legend-row">
    <div class="legend" id="legend">Loading...</div>
    <form id="pm-url-form" class="pm-url-form">
      <span id="pm-expiry-countdown" class="pm-expiry-countdown hidden" aria-live="polite"></span>
      <input
        type="url"
        id="pm-url-input"
        name="pm_url"
        placeholder="Polymarket event URL"
        autocomplete="off"
        spellcheck="false"
      >
      <button type="submit" id="pm-url-apply">Apply</button>
    </form>
  </div>

  <div class="chart-container">
    <div class="chart-main">
      <ul id="pm-strike-labels" class="pm-strike-labels" aria-label="Polymarket strike levels"></ul>
      <div id="chart-prices" class="chart-pane"></div>
    </div>
    <div id="chart-tooltip" class="chart-tooltip hidden" aria-hidden="true"></div>
  </div>

  <script src="/static/js/chart.js"></script>
</body>
</html>
