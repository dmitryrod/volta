name: volta

services:
  postgres:
    image: postgres:15-alpine
    container_name: volta-postgres
    restart: always
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - volta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - volta_internal

  postgres-expose:
    image: alpine:3.19
    container_name: volta-postgres-expose
    command: ["sleep", "infinity"]
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev-tools
    ports:
      - "${VOLTA_POSTGRES_PORT:-5436}:5432"

  api:
    build: .
    container_name: volta-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./frontend/static:/app/frontend/static:ro
      - ./app_options/templates:/app/app_options/templates:ro
    command:
      - sh
      - -c
      - |
        uv run alembic upgrade head
        uv run uvicorn app_options.__main__:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    restart: always
    networks:
      - volta_internal

  nginx:
    image: nginx:alpine
    container_name: volta-nginx
    ports:
      - "${VOLTA_HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/static:/usr/share/nginx/static:ro
    depends_on:
      - api
    restart: always
    networks:
      - volta_internal

volumes:
  volta_pgdata:

networks:
  volta_internal:
    driver: bridge
