<!DOCTYPE html>
<html>
<body>
<div id="c" style="width:600px;height:400px"></div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const chart = LightweightCharts.createChart(document.getElementById("c"), { width: 600, height: 400 });
const s = chart.addLineSeries();
const data = [];
for (let i = 0; i < 100; i++) {
  data.push({ time: 1700000000 + i * 86400, value: 100 + Math.sin(i / 10) * 20 });
}
s.setData(data);
chart.timeScale().fitContent();
const ps = chart.priceScale("right");
const proto = Object.getOwnPropertyNames(Object.getPrototypeOf(ps));
const chartProto = Object.getOwnPropertyNames(Object.getPrototypeOf(chart)).filter(function (m) {
  return /price|coordinate|scale/i.test(m);
});
document.body.insertAdjacentHTML("beforeend", "<pre id=out></pre>");
const out = document.getElementById("out");
function log(msg) {
  out.textContent += msg + "\n";
}
log("priceScale methods: " + proto.join(", "));
log("chart price methods: " + chartProto.join(", "));
setTimeout(function () {
  log("initial autoScale " + ps.options().autoScale);
  log("initial getVisibleRange " + JSON.stringify(ps.getVisibleRange()));
  ps.applyOptions({ autoScale: false });
  ps.setVisibleRange({ from: 90, to: 130 });
  log("after set autoScale " + ps.options().autoScale);
  log("after set getVisibleRange " + JSON.stringify(ps.getVisibleRange()));
  if (typeof chart.priceToCoordinate === "function") {
    log("priceToCoordinate 100 -> " + chart.priceToCoordinate(100));
    log("coordinateToPrice 200 -> " + chart.coordinateToPrice(200));
  }
}, 100);
</script>
</body>
</html>
